<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1 class="auth-heading">Forgot password</h1>
  <p class="auth-subtitle">Enter your account email and we'll send you a link to reset your password.</p>

  @if (alert(); as a) {
    <app-form-alert [kind]="a.kind">{{ a.text }}</app-form-alert>
  }

  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" type="email" autocomplete="email" inputmode="email" />
    <mat-error>{{ fieldError(form.controls.email, 'Email', { pattern: 'Enter a valid email address.' }) }}</mat-error>
  </mat-form-field>

  <button mat-flat-button class="auth-submit" type="submit" [disabled]="loading() || cooldown.active()">
    @if (loading()) {
      <mat-spinner class="button-spinner" diameter="18" />
    }
    @if (cooldown.active()) {
      Send again in {{ cooldown.remaining() }} s
    } @else {
      {{ sentTo() ? 'Send link again' : 'Send reset link' }}
    }
  </button>

  <p class="auth-footer">
    <a routerLink="/login" [queryParams]="{ email: form.controls.email.value || null }">Back to sign in</a>
  </p>
</form>
