<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1 class="auth-heading">Create account</h1>
  <p class="auth-subtitle">Open a FinCore customer account. We'll email you a code to confirm it.</p>

  @if (error(); as message) {
    <app-form-alert kind="error">{{ message }}</app-form-alert>
  }

  <app-registration-fields [form]="form" />

  <button mat-flat-button class="auth-submit" type="submit" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner class="button-spinner" diameter="18" />
    }
    Create account
  </button>

  <p class="auth-footer">Already have an account? <a routerLink="/login">Sign in</a></p>
</form>
