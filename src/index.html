<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FinCore</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .boot-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      font: 14px/1.4 Roboto, system-ui, sans-serif; color: #44474e; background: #fdfbff; }
    .boot-spinner { width: 40px; height: 40px; border: 4px solid #d8e2ff; border-top-color: #005cbb; border-radius: 50%;
      animation: boot-spin 0.9s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <!-- Shown until Angular renders (the app initializer restores the session first), so neither an empty page
       nor the landing page flashes for a returning user. Angular replaces it on bootstrap. -->
  <app-root>
    <div class="boot-loader" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <span>Loading FinCore…</span>
    </div>
  </app-root>
</body>
</html>
