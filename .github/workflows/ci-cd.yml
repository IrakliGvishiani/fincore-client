name: CI/CD

# Put this file in the fincore-client (Angular) repository as .github/workflows/ci-cd.yml
on:
  pull_request:
  push:
    branches: [main,master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The unit tests run with Karma. If Chrome fails to start on the runner
      # (sandbox error), add a custom ChromeHeadless launcher with --no-sandbox
      # in karma.conf.js and use it here.
      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Production build
        run: npm run build -- --configuration production

      # Catches Dockerfile / nginx problems before they reach the server.
      - name: Build web client image
        run: docker build -t fincore-client:ci .

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy web client over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" client
