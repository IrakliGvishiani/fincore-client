# Main nginx config for the FinCore client image. Runs as the non-root "nginx" user:
# pid and temporary files live in /tmp (writable), logs go to stdout/stderr (docker logs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" rt=$request_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;   # no nginx version in headers or error pages

  # gzip for text assets (the host reverse proxy may also compress; that is fine).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/xml image/svg+xml application/manifest+json font/ttf font/otf;

  include /etc/nginx/conf.d/*.conf;
}
