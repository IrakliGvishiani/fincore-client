# FinCore client: serves the Angular SPA and proxies /api/ to the API container (same origin, no CORS).

# Trust X-Forwarded-For from the host reverse proxy (Caddy/nginx on the droplet) and the Docker networks,
# so $remote_addr / X-Real-IP is the visitor's address, not the proxy's. The container port is only
# published on 127.0.0.1, so nobody outside the host can spoof this header directly.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep the scheme the visitor used (https at the host proxy), fall back to ours (http).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Profile photos are max 2 MB (backend limit); leave room for multipart overhead.
  client_max_body_size 5m;

  # Docker's embedded DNS. With a variable in proxy_pass, the API host name is resolved per request (cached
  # 30 s), so nginx starts even if the API container is not up yet (no "host not found in upstream").
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  # ---- Container healthcheck -------------------------------------------------------------------------------
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- API (same origin) -----------------------------------------------------------------------------------
  # Compose service "fincore.api" (container_name "fincore"), ASP.NET listening on http://+:8080.
  # The full original URI (/api/...) is passed on unchanged, which is what the backend routes expect.
  location /api/ {
    set $fincore_api http://fincore.api:8080;
    proxy_pass $fincore_api;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;   # receipts (PDF) and statement pages are the slowest calls

    # API responses must never be cached by browsers or proxies (tokens, balances).
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ---- Hashed build output: cache forever ------------------------------------------------------------------
  # Angular (outputHashing: all) names files like main-ABCD1234.js, chunk-ABCD1234.js, styles-ABCD1234.css,
  # and puts referenced fonts/images in /media/. A missing old chunk after a deploy must 404, not get index.html.
  location ~ "^/(?:.+-[A-Z0-9]{8}\.(?:js|css)|media/.+)$" {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ---- index.html: always revalidate (it points to the current hashed files) --------------------------------
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ---- Everything else: real files (favicon, public/), otherwise the SPA ------------------------------------
  # Client routes like /dashboard or /manager/accounts/5 fall back to index.html (F5 on a deep link works).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
