# Security headers, included in every location that sets its own add_header (nginx does not inherit
# add_header into a location that defines one, so they are kept in this one snippet).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The password-reset link carries email + token in the query string; the app removes them from the URL as soon
# as the page reads them and adds <meta name="referrer" content="no-referrer"> on that page. This policy also
# never sends a path/query to other origins.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs on the HTTPS host proxy (Caddy adds it), not on this plain-HTTP container.

# Content-Security-Policy — what the app really loads:
#   script-src  'self'                          only our hashed bundles (no inline scripts, no eval: production
#                                               Angular, zone.js and Chart.js need neither; critical-CSS inlining
#                                               with onload="" is disabled in angular.json for this reason)
#   style-src   'self' 'unsafe-inline'          Angular/Material inject <style> elements and style="" bindings,
#               https://fonts.googleapis.com     index.html has the inline boot-loader style; Google Fonts CSS
#                                               (Roboto + Material Icons; normally inlined at build time)
#   font-src    'self' https://fonts.gstatic.com font files referenced by that Google Fonts CSS
#   img-src     'self' data: blob:              favicon, data: URIs, blob: = local photo preview before upload
#               https://res.cloudinary.com      profile photos and recipient photos (Cloudinary, https)
#   connect-src 'self'                          XHR only to /api on the same origin
#   frame-ancestors 'none', object-src 'none', base-uri 'self', form-action 'self'
#
# Shipped as REPORT-ONLY first: violations appear in the browser console but nothing is blocked. After clicking
# through every screen (landing, auth, customer pages incl. charts and the Demo Shop, manager, admin) with no
# violations, switch to enforcing by replacing the header name with "Content-Security-Policy".
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;
